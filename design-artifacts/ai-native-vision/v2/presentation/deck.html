  <style>
    :root {
      --ink: #202124;
      --muted: #545358;
      --red: #b5121b;
      --paper: #fcfbf9;
      --rule: #e1deda;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      color: var(--ink);
      background: #242426;
    }
    * { box-sizing: border-box; }
    body, h1, h2, p, ul, figure { margin: 0; }
    [hidden] { display: none !important; }
    button, select { font: inherit; }
    button:focus-visible, select:focus-visible { outline: 2px solid #ff827e; outline-offset: 3px; }
    .viewer {
      min-height: 100svh;
      padding: 1.25rem 1.5rem;
      display: grid;
      place-items: center;
    }
    .shell { width: min(100%, calc((100svh - 6.5rem) * 16 / 9), 110rem); }
    .deck { container-type: inline-size; }
    .slide {
      position: relative;
      aspect-ratio: 16 / 9;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 1.6cqw;
      padding: 3.1cqw 4.4cqw 2.35cqw;
      background: var(--paper);
    }
    .slide + .slide { margin-top: 1rem; }
    .enhanced .slide { margin-top: 0; }
    .slide-head, .slide-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .slide-head { padding-bottom: 1.15cqw; border-bottom: 1px solid var(--rule); }
    .brand { display: inline-flex; align-items: center; gap: .55cqw; font-size: 1.23cqw; font-weight: 740; }
    .brand-mark { width: 1.75cqw; height: 1.75cqw; background: /* DUET_MARK */ center / contain no-repeat; }
    .chapter { color: var(--muted); font-size: 1.04cqw; font-weight: 620; letter-spacing: .08em; }
    .story {
      display: grid;
      align-items: center;
      grid-template-columns: minmax(0, .78fr) minmax(0, 1.22fr);
      gap: 3.2cqw;
    }
    .story h2 {
      margin-bottom: 1.1cqw;
      font-size: 3.9cqw;
      font-weight: 750;
      line-height: 1.07;
      letter-spacing: -.052em;
      text-wrap: balance;
    }
    .slide[lang="zh-CN"] .story h2 { line-height: 1.18; letter-spacing: -.035em; }
    .lead { font-size: 1.57cqw; line-height: 1.52; font-weight: 560; }
    .points {
      margin-top: 1.55cqw;
      padding: 1.15cqw 0 0;
      border-top: 1px solid var(--rule);
      list-style: none;
      color: var(--muted);
      font-size: 1.24cqw;
      line-height: 1.52;
    }
    .points li { position: relative; padding-left: 1cqw; }
    .points li + li { margin-top: .65cqw; }
    .points li::before {
      position: absolute;
      top: .72em;
      left: 0;
      width: .45cqw;
      height: 2px;
      content: "";
      background: var(--red);
    }
    .film-still img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 36cqw;
      object-fit: contain;
      background: white;
      border: 1px solid var(--rule);
    }
    .film-still figcaption {
      padding-top: .67cqw;
      color: var(--muted);
      font-size: .91cqw;
      font-variant-numeric: tabular-nums;
      letter-spacing: .035em;
    }
    .slide-foot {
      color: var(--muted);
      font-size: 1.03cqw;
      font-variant-numeric: tabular-nums;
    }
    .slide-foot::before { width: 2.4cqw; height: 2px; content: ""; background: var(--red); }
    .cover .story { grid-template-columns: 1fr .85fr; }
    .cover h1 { font-size: 8.8cqw; font-weight: 760; line-height: .98; letter-spacing: -.075em; }
    .cover h1 span { display: block; color: var(--red); }
    .cover .lead { margin-top: 2cqw; font-size: 2.04cqw; line-height: 1.35; }
    .cover .story > .brand-mark { width: 23cqw; height: 23cqw; justify-self: center; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .65rem;
      padding-top: .8rem;
      color: #f6f4f2;
    }
    .controls { display: flex; align-items: center; gap: .4rem; min-width: 0; }
    .toolbar button, .toolbar select {
      min-height: 2.5rem;
      border: 1px solid #555255;
      border-radius: 5px;
      background: #323236;
      color: inherit;
      cursor: pointer;
    }
    .toolbar button { padding: .32rem .62rem; white-space: nowrap; }
    .toolbar button[data-direction] { width: 2.5rem; font-size: 1.15rem; }
    .toolbar button:hover:not(:disabled), .toolbar select:hover { background: #424247; }
    .toolbar button[aria-pressed="true"], .toolbar button[aria-expanded="true"] {
      background: #f6f4f2;
      color: var(--ink);
    }
    .toolbar button:disabled { opacity: .4; cursor: default; }
    .toolbar select { width: min(24vw, 16rem); padding-inline: .55rem; text-overflow: ellipsis; }
    .count { padding-inline: .25rem; white-space: nowrap; font-size: .85rem; font-variant-numeric: tabular-nums; }
    .notes-panel {
      position: fixed;
      inset: auto max(1.5rem, calc((100vw - 58rem) / 2)) 4.6rem;
      z-index: 1;
      padding: 1.15rem 1.4rem;
      max-height: 45svh;
      overflow: auto;
      border: 1px solid #555255;
      border-radius: 6px;
      background: #202124;
      color: #fcfbf9;
      box-shadow: 0 4px 28px #0005;
    }
    .notes-panel h2 { margin-bottom: .45rem; font-size: .85rem; color: #ffd1ce; }
    .notes-panel p { line-height: 1.55; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    @media (max-width: 800px) and (orientation: portrait) {
      .viewer { padding: .7rem; display: block; }
      .shell { width: 100%; }
      .slide { min-height: min(78svh, 41rem); aspect-ratio: auto; padding: 1.25rem; gap: 1.25rem; }
      .slide-head { padding-bottom: .7rem; }
      .brand { gap: .4rem; font-size: .9rem; }
      .brand-mark { width: 1.25rem; height: 1.25rem; }
      .chapter, .slide-foot, .film-still figcaption { font-size: .72rem; }
      .story { grid-template-columns: 1fr; align-content: center; gap: 1.5rem; }
      .story h2 { margin-bottom: .55rem; font-size: clamp(1.9rem, 7.8vw, 3rem); }
      .lead { font-size: 1.05rem; }
      .points { margin-top: .8rem; padding-top: .7rem; font-size: .92rem; }
      .points li { padding-left: .8rem; }
      .points li + li { margin-top: .3rem; }
      .points li::before { width: .32rem; }
      .film-still img { max-height: 48cqw; }
      .film-still figcaption { padding-top: .4rem; }
      .cover .story { grid-template-columns: 1fr; align-content: center; }
      .cover h1 { font-size: clamp(3.65rem, 14vw, 7rem); }
      .cover .lead { margin-top: .85rem; font-size: 1.2rem; }
      .cover .story > .brand-mark { width: 29cqw; height: 29cqw; justify-self: start; }
      .slide-foot::before { width: 1.5rem; }
      .toolbar { flex-wrap: wrap; padding-top: .6rem; font-size: .82rem; }
      .toolbar select { width: clamp(6rem, 34vw, 16rem); }
      .notes-panel { position: static; margin-top: .7rem; max-height: none; }
    }
    @page { size: 16in 9in; margin: 0; }
    @media print {
      :root, .viewer { background: white; }
      .viewer { display: block; min-height: 0; padding: 0; }
      .shell { width: 100%; }
      .toolbar, .notes-panel, .sr-only, .slide[data-print="no"] { display: none !important; }
      .slide[hidden][data-print="yes"] { display: grid !important; }
      .slide { break-after: page; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .slide:last-child, .slide[data-last="yes"] { break-after: auto; }
      .slide + .slide { margin-top: 0; }
    }
  </style>
</head>
<body>
  <main class="viewer">
    <div class="shell">
      <div class="deck" id="deck">
        <!-- SLIDES -->
      </div>
      <nav class="toolbar" id="toolbar" aria-label="演示控制" hidden>
        <div class="controls">
          <button id="previous" type="button" data-direction="previous" aria-label="上一页">←</button>
          <output class="count" id="count" aria-hidden="true"></output>
          <button id="next" type="button" data-direction="next" aria-label="下一页">→</button>
          <select id="jump" aria-label="跳转到指定页"></select>
        </div>
        <div class="controls">
          <button id="notes-toggle" type="button" aria-controls="notes" aria-expanded="false">备注</button>
          <button id="fullscreen" type="button">全屏</button>
          <button type="button" data-language="zh" lang="zh-CN" aria-pressed="true">中文</button>
          <button type="button" data-language="en" lang="en" aria-pressed="false">EN</button>
        </div>
      </nav>
      <aside class="notes-panel" id="notes" aria-labelledby="notes-title" hidden>
        <h2 id="notes-title"></h2>
        <p id="notes-copy"></p>
      </aside>
      <p class="sr-only" id="announcement" role="status"></p>
    </div>
  </main>
  <script>
    const get = (id) => document.getElementById(id);
    const slides = { zh: [], en: [] };
    for (const slide of get('deck').children) slides[slide.dataset.language].push(slide);
    const labels = {
      zh: { nav: '演示控制', prev: '上一页', next: '下一页', jump: '跳转到指定页',
        notes: '备注', noteTitle: '演讲备注', full: '全屏', exit: '退出全屏' },
      en: { nav: 'Presentation controls', prev: 'Previous slide', next: 'Next slide', jump: 'Go to slide',
        notes: 'Notes', noteTitle: 'Speaker notes', full: 'Full screen', exit: 'Exit full screen' },
    };
    const langButtons = [...document.querySelectorAll('[data-language]')].filter((el) => el.matches('button'));
    const total = slides.zh.length;
    const number = (index) => String(index + 1).padStart(2, '0');
    const title = (slide) => slide.querySelector('h1, h2').innerText.replace(/\s+/g, ' ').trim();
    const notes = get('notes');
    const notesToggle = get('notes-toggle');
    const fullscreen = get('fullscreen');
    const jump = get('jump');
    let language;
    let index;
    let active;

    function updateFullscreenLabel() {
      fullscreen.textContent = document.fullscreenElement ? labels[language].exit : labels[language].full;
    }

    function show(requested, lang = language) {
      index = Math.max(0, Math.min(total - 1, requested));
      const current = slides[lang][index];
      if (language !== lang) {
        language = lang;
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        const text = labels[lang];
        get('toolbar').setAttribute('aria-label', text.nav);
        get('previous').setAttribute('aria-label', text.prev);
        get('next').setAttribute('aria-label', text.next);
        jump.setAttribute('aria-label', text.jump);
        notesToggle.textContent = text.notes;
        get('notes-title').textContent = text.noteTitle;
        updateFullscreenLabel();
        for (const button of langButtons) button.setAttribute('aria-pressed', button.dataset.language === lang);
        for (const [key, pages] of Object.entries(slides)) {
          for (const page of pages) page.dataset.print = key === lang ? 'yes' : 'no';
        }
        jump.replaceChildren(...slides[lang].map((page, i) =>
          new Option(`${number(i)}  ${page.querySelector('h1, h2').textContent.trim()}`, i)));
      }
      if (active) active.hidden = true;
      current.hidden = false;
      active = current;
      get('count').textContent = `${number(index)} / ${total}`;
      jump.value = index;
      get('previous').disabled = index === 0;
      get('next').disabled = index === total - 1;
      get('notes-copy').textContent = current.querySelector('template').content.textContent.trim();
      get('announcement').textContent = `${number(index)} / ${total}. ${title(current)}`;
      document.title = `${title(current)} · Duet AI Native`;
      const hash = `#${lang}-${number(index)}`;
      if (location.hash !== hash) history.replaceState(null, '', hash);
    }

    function fromHash() {
      const match = /^#(zh|en)-(\d{1,2})$/.exec(location.hash);
      show(match ? Number(match[2]) - 1 : 0, match ? match[1] : 'zh');
    }

    function toggleNotes() {
      notes.hidden = !notes.hidden;
      notesToggle.setAttribute('aria-expanded', !notes.hidden);
      if (!notes.hidden && getComputedStyle(notes).position === 'static') {
        notes.scrollIntoView({block: 'nearest'});
      }
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        fullscreen.hidden = true;
      }
    }

    for (const page of Object.values(slides).flat()) page.hidden = true;
    document.documentElement.classList.add('enhanced');
    fromHash();
    get('toolbar').hidden = false;
    fullscreen.hidden = !document.fullscreenEnabled;
    get('previous').addEventListener('click', () => show(index - 1));
    get('next').addEventListener('click', () => show(index + 1));
    jump.addEventListener('change', () => show(Number(jump.value)));
    notesToggle.addEventListener('click', toggleNotes);
    fullscreen.addEventListener('click', toggleFullscreen);
    for (const button of langButtons) button.addEventListener('click', () => show(index, button.dataset.language));
    window.addEventListener('hashchange', fromHash);
    document.addEventListener('fullscreenchange', updateFullscreenLabel);
    document.addEventListener('keydown', (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === 'Escape' && !notes.hidden) {
        toggleNotes();
        return;
      }
      if (event.target.matches('select, input, textarea') || (event.key === ' ' && event.target.matches('button'))) return;
      const key = event.key.toLowerCase();
      if (['arrowright', 'pagedown', ' '].includes(key)) show(index + 1);
      else if (['arrowleft', 'pageup'].includes(key)) show(index - 1);
      else if (key === 'home') show(0);
      else if (key === 'end') show(total - 1);
      else if (key === 'n') toggleNotes();
      else if (key === 'f' && !fullscreen.hidden) toggleFullscreen();
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
